name: Test mimetype against UNIX file(1)
on:
  workflow_dispatch:
    inputs:
      version1:
        description: 'What mimetype version to test initially'
        default: 'github.com/gabriel-vasile/mimetype@master'
      version2:
        description: |
          What mimetype version to compare with;
          forks can be used too, ex: github.com/username/mimetype@commitSHA
        default: ''
        required: true
env:
  CI: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout file
      uses: actions/checkout@v4.2.2
      with:
        repository: file/file
    - name: Build file
      run: |
        echo "RUNNER home ${{ github.workspace }}"
        which file
        file --version
        autoreconf -f -i
        ./configure --disable-silent-rules
        make -j4
        sudo make install
        mkdir /tmp/file && cp -r ./* /tmp/file
        shopt -s expand_aliases # https://github.com/actions/toolkit/issues/766
        alias file='/tmp/file/src/file -m /tmp/file/magic/magic.mgc'
        which file
        file --version
        file --mime ./*
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Install Go
      uses: actions/setup-go@v5.4.0
      with:
        go-version-file: 'go.mod'
    - name: Generate extra files
      run: |
        go run zipshuffler.go
        go run truncate.go
    - name: debug
      run: |
        shopt -s expand_aliases # https://github.com/actions/toolkit/issues/766
        alias file='/tmp/file/src/file -m /tmp/file/magic/magic.mgc'
        file --mime --debug testfiles/zips/166.zip
        exit 1
    - name: Initial run
      run: |
        shopt -s expand_aliases # https://github.com/actions/toolkit/issues/766
        alias file='/tmp/file/src/file -m /tmp/file/magic/magic.mgc'
        go mod edit -replace="github.com/gabriel-vasile/mimetype=${{ github.event.inputs.version1 }}"
        go mod tidy
        go run main.go > version1
    - name: Second run
      run: |
        shopt -s expand_aliases # https://github.com/actions/toolkit/issues/766
        alias file='/tmp/file/src/file -m /tmp/file/magic/magic.mgc'
        go mod edit -replace="github.com/gabriel-vasile/mimetype=${{ github.event.inputs.version2 }}"
        go mod tidy
        DEBUG=1 go run main.go > version2
    - name: Compare results
      run: diff --color=always version1 version2 || true
    - name: debug
      run: |
        shopt -s expand_aliases # https://github.com/actions/toolkit/issues/766
        alias file='/tmp/file/src/file -m /tmp/file/magic/magic.mgc'
        file --mime --debug testfiles/zips/166.zip
