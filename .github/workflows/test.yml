name: Test mimetype against UNIX file(1)
on:
  workflow_dispatch:
    inputs:
      version1:
        description: 'What mimetype version to test initially'
        default: 'github.com/gabriel-vasile/mimetype@master'
      version2:
        description: |
          What mimetype version to compare with;
          forks can be used too, ex: github.com/username/mimetype@commitSHA
        default: ''
        # required: true
env:
  CI: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout file
      uses: actions/checkout@v4.2.2
      with:
        repository: file/file
    - name: Build file
      run: |
        echo "RUNNER home ${{ github.workspace }}"
        which file
        file --version
        sudo apt-get -y purge file libmagic1
        sudo apt-get install libtool
        autoreconf -f -i
        ./configure --disable-silent-rules --prefix=/usr
        make -j4
        sudo make install
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Install Go
      uses: actions/setup-go@v5.4.0
      with:
        go-version-file: 'go.mod'
    - name: Generate extra files
      run: |
        go run zipshuffler.go
        go run truncate.go
    - name: Initial run
      run: |
        file --mime --debug testfiles/zips/166.zip
        file --mime testfiles/zips/166.zip
